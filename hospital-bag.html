<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Що взяти з собою в лікарню</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="patient-page">
  <div class="container">
    <span class="eyebrow">Для пацієнта</span>
    <h1>Що взяти з собою в лікарню</h1>

    <div class="card patient-page-card">
      <div class="patient-checklist">
        <label class="checklist-row"><input type="checkbox"><span class="checklist-text">Паспорт / документ</span></label>
        <label class="checklist-row"><input type="checkbox"><span class="checklist-text">Медичні документи й результати аналізів</span></label>
        <label class="checklist-row"><input type="checkbox"><span class="checklist-text">Перелік постійних ліків</span></label>
        <label class="checklist-row"><input type="checkbox"><span class="checklist-text">Зручний одяг і взуття</span></label>
        <label class="checklist-row"><input type="checkbox"><span class="checklist-text">Засоби гігієни</span></label>
      </div>

      <div class="patient-actions">
        <button class="btn" onclick="window.print()">Друкувати список</button>
        <a class="btn ghost" href="index.html#patient">Назад на сайт</a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
