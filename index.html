<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Маковецький Олександр — лікар-хірург</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><header class="topbar"><div class="wrap"><b id="siteName">Маковецький Олександр</b><nav><a href="#about">Про лікаря</a><a href="#services">Послуги</a><a href="#blog">Блог</a><a href="#reviews">Відгуки</a><a href="#contact">Запис</a></nav></div></header><main><section class="hero wrap"><div><div id="heroKicker">Лікар-хірург · Київ</div><h1 id="heroTitle">Сучасна хірургія з турботою про пацієнта</h1><p id="heroDescription"></p><a class="btn" href="#contact" id="heroButton">Записатися</a></div><img id="heroImage" alt="Лікар"></section><section id="about" class="section"><div class="wrap"><h2>Про лікаря</h2><div class="card"><h3 id="doctorName"></h3><p id="doctorPosition"></p><p id="doctorDescription"></p><p><b>Досвід:</b> <span id="doctorExperience"></span></p><p><b>Освіта:</b> <span id="doctorEducation"></span></p><p><b>Напрями:</b> <span id="doctorDirections"></span></p></div></div></section><section id="services" class="section alt"><div class="wrap"><h2>Послуги</h2><div id="servicesGrid" class="grid"></div></div></section><section id="blog" class="section"><div class="wrap"><h2>Блог</h2><div id="blogGrid" class="grid"></div></div></section><section id="reviews" class="section alt"><div class="wrap"><h2>Відгуки</h2><div id="reviewsGrid"></div><div class="card"><form id="reviewForm" class="form"><input id="rname" placeholder="Ім'я" required><select id="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><textarea id="rtext" placeholder="Відгук" required></textarea><button class="btn">Надіслати</button></form></div></div></section><section id="contact" class="section"><div class="
