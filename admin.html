<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMS</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div id="login" class="login"><div class="loginbox"><h1>CMS</h1><form id="loginForm" class="form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль" required><button class="btn">Увійти</button></form><p id="loginMsg"></p></div></div><div id="adminApp" class="admin-layout" style="display:none"><aside class="sidebar"><h3>CMS</h3><button class="active" data-panel="settings">🏠 Головна</button><button data-panel="doctor">👨‍⚕️ Лікар</button><button data-panel="services">🩺 Послуги</button><button data-panel="blog">📰 Блог</button><button data-panel="reviews">⭐ Відгуки</button><button data-panel="appointments">📋 Заявки</button><button data-panel="design">🎨 Дизайн</button><button id="logoutBtn">Вийти</button></aside><main class="admin-main"><section id="panel-settings" class="panel active"><div class="admin-card"><h2>Налаштування</h2><div id="settingsForm" class="admin-grid"></div><button class="btn" id="saveSettings">Зберегти</button></div></section><section id="panel-doctor" class="panel"><div class="admin-card"><h2>Лікар</h2><div id="doctorForm" class="admin-grid"></div><button class="btn" id="saveDoctor">Зберегти</button></div></section><section id="panel-services" class="panel"><div class="admin-card"><div class="row"><h2>Послуги</h2><button class="btn" id="newService">+ Додати</button></div><div id="servicesList"></div></div></section><section id="panel-blog" class="panel"><div class="admin-card"><div class="row"><h2>Блог</h2><button class="btn" id="newPost">+ Стаття</button></div><div id="blogList"></div></div></section><section id="panel-reviews" class="panel"><div class="admin-card"><h2>Відгуки</h2><div id="reviewsList"></div></div></section><section id="panel-appointments" class="panel"><div class="admin-card"><h2>Заявки</h2><div id="appointmentsList"></div></div></section><section id="panel-design" class="panel"><div class="admin-card"><h2>Дизайн</h2><div class="admin-grid"><label>Основний колір<input id="design_primary" type="color"></label><label>Фон<input id="design_bg" type="color"></label><label>Текст<input id="design_text" type="color"></label><label>Радіус карток<input id="design_radius" type="number"></label><label>Радіус кнопок<input id="design_button_radius" type="number"></label><label>Шрифт<input id="design_font"></label></div><button class="btn" id="saveDesign">Зберегти</button></div></section></main></div><script src="admin.js"></script></body></html>
